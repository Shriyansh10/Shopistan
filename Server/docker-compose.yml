# Journal — Server/docker-compose.yml
#
# Before: MongoDB (mongo:latest, port 27017) + mongoclient web UI (port 3300) on a bridge network,
#   with no volume, so each `docker compose down` + `up` started an empty database.
#
# 2026-10-05 (Claude): Mounted a named volume (mongodb_data) at /data/db so data survives container
#   re-creation; restored the previous shopistan data into it. Removed the obsolete `version` key.

networks:
  mongodb_net:
    driver: bridge
    ipam:
      driver: default
      config:
      # Change this subnet range if it conflicts with your personal/work network
        - subnet: 192.168.213.0/24
          gateway: 192.168.213.1
services:
    mongodb:
      image: mongo:latest
      container_name: mongodb
      hostname: mongodb
      networks:
        - mongodb_net
      ports:
        - 27017:27017
      volumes:
        - mongodb_data:/data/db
    mongoclient:
      image: mongoclient/mongoclient:latest
      container_name: mongoclient
      hostname: mongoclient
      depends_on:
        - mongodb
      networks:
        - mongodb_net
      ports:
        - 3300:3000
volumes:
  mongodb_data:
